name: Apple

on:
  pull_request:
    paths:
      - "apple/**"
      - "sync/**"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "sync/**"
      - ".github/workflows/apple.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apple
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test

      - name: Check formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests iOS

      - name: Build the iOS UI
        run: swift build --scratch-path .build/ios --target AbakusIOSUI --triple arm64-apple-ios26.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -Xswiftc -warnings-as-errors

      - name: Build the iOS app and test the core on the iOS simulator
        run: tools/test_ios.sh
