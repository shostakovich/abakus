name: CI

# Pushes to main run these tests through docker.yml.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}

      - name: Fetch deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      # The receipt tests tagged :pdftotext need poppler's pdftotext, the invoice tests tagged :typst Typst and
      # poppler's pdfinfo and pdfdetach, in the image's versions.
      - name: Install poppler and Typst
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: Run tests
        run: mix test

      # esbuild fails on an import that does not resolve; the tests never load the bundles.
      - name: Build assets
        run: mix assets.setup && mix assets.deploy
